<!doctype html>
<html lang="en" class="h-100">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin Login · Lapar Smart</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="{{ url_for('static', filename='vendor/dashboard/css/style.css') }}" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/lapar.css') }}" rel="stylesheet">
</head>
<body class="h-100">
  <div class="authincation h-100 lapar-page-body">
    <div class="container h-100">
      <div class="row justify-content-center h-100 align-items-center">
        <div class="col-12 col-md-6 col-xl-4">
          <div class="card login-card shadow-sm">
            <div class="card-body p-4">
              <div class="text-center mb-4">
                <i class="fa-solid fa-bowl-food fa-2x text-primary mb-2"></i>
                <h3 class="fw-bold mb-0">Cafe Admin Login</h3>
                <p class="text-muted small">Lapar Smart &middot; Lazaria Cafe</p>
              </div>
              {% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}
              <form method="post">
                <div class="form-group mb-3">
                  <label class="mb-1 text-black">Passcode</label>
                  <input type="password" name="passcode" class="form-control" autofocus required>
                </div>
                <div class="text-center">
                  <button type="submit" class="btn btn-primary btn-block w-100">Login</button>
                </div>
              </form>
              <p class="text-muted small text-center mt-3">Demo passcode: <code>admin123</code></p>
              <div class="text-center">
                <a href="{{ url_for('staff.landing') }}" class="text-muted small"><i class="fa-solid fa-arrow-left me-1"></i>Back to staff ordering</a>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
