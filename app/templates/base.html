<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Lapar Smart{% endblock %} · Lazaria Cafe</title>
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='vendor/frontend/images/favicon.png') }}">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="{{ url_for('static', filename='vendor/frontend/css/style.css') }}" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/lapar.css') }}" rel="stylesheet">
</head>
<body class="lapar-body">
  <div id="main-wrapper">
    <header class="site-header mo-left header style-1">
      <div class="sticky-header main-bar-wraper navbar-expand-lg">
        <div class="main-bar clearfix">
          <div class="container-fluid clearfix">
            <div class="logo-header mostion logo-dark">
              <a href="{{ url_for('staff.landing') }}" class="lapar-brand">
                <i class="fa-solid fa-bowl-food"></i> Lapar Smart
              </a>
            </div>
            <button class="navbar-toggler collapsed navicon" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavDropdown" aria-controls="navbarNavDropdown" aria-expanded="false" aria-label="Toggle navigation">
              <span></span><span></span><span></span>
            </button>
            <div class="extra-nav">
              <div class="extra-cell">
                <span class="lapar-subtitle">Lazaria Cafe &middot; FAMA</span>
              </div>
            </div>
            <div class="header-nav navbar-collapse collapse" id="navbarNavDropdown">
              <div class="close-nav">
                <button type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavDropdown" aria-label="Close menu">&times;</button>
              </div>
              <ul class="nav navbar-nav navbar navbar-left">
                <li class="{{ 'active' if request.endpoint == 'staff.landing' }}"><a href="{{ url_for('staff.landing') }}"><i class="fa-solid fa-qrcode"></i> Scan</a></li>
                <li class="{{ 'active' if request.endpoint == 'staff.menu' }}"><a href="{{ url_for('staff.menu') }}"><i class="fa-solid fa-utensils"></i> Menu</a></li>
                <li><a href="{{ url_for('admin.login') }}"><i class="fa-solid fa-user-shield"></i> Cafe Admin</a></li>
              </ul>
            </div>
          </div>
        </div>
      </div>
    </header>

    <div class="lapar-page-body">
      <div class="container-fluid lapar-container">
        {% block content %}{% endblock %}
      </div>
    </div>

    <footer class="lapar-footer">Lapar Smart: QR Menu Ordering System &mdash; FYP Demo</footer>
  </div>

  <script src="{{ url_for('static', filename='vendor/frontend/vendor/global/global.min.js') }}"></script>
  <script src="{{ url_for('static', filename='vendor/frontend/js/custom.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
