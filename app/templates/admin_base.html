<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Admin{% endblock %} · Lapar Smart</title>
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='vendor/dashboard/images/favicon.png') }}">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="{{ url_for('static', filename='vendor/dashboard/css/style.css') }}" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/lapar.css') }}" rel="stylesheet">
</head>
<body>
  <div id="main-wrapper">
    <div class="nav-header">
      <a href="{{ url_for('admin.orders') }}" class="brand-logo">
        <span class="logo-abbr fw-bold text-primary fs-3"><i class="fa-solid fa-bowl-food"></i></span>
        <span class="brand-title fw-bold fs-5 ms-2">Lapar Smart</span>
      </a>
      <div class="nav-control">
        <div class="hamburger">
          <span class="line"></span><span class="line"></span><span class="line"></span>
        </div>
      </div>
    </div>

    <div class="header">
      <div class="header-content">
        <nav class="navbar navbar-expand">
          <div class="collapse navbar-collapse justify-content-between">
            <div class="header-left">
              <h4 class="mb-0 fw-bold">{% block page_title %}Admin Dashboard{% endblock %}</h4>
            </div>
            <ul class="navbar-nav header-right">
              <li class="nav-item">
                <span class="me-3 text-muted"><i class="fa-solid fa-shop me-1"></i>Lazaria Cafe</span>
              </li>
              <li class="nav-item">
                <a href="{{ url_for('admin.logout') }}" class="btn btn-outline-danger btn-sm btn-rounded">
                  <i class="fa-solid fa-right-from-bracket me-1"></i>Logout
                </a>
              </li>
            </ul>
          </div>
        </nav>
      </div>
    </div>

    <div class="deznav">
      <div class="deznav-scroll">
        <ul class="metismenu" id="menu">
          <li class="{{ 'mm-active' if request.endpoint == 'admin.orders' }}">
            <a href="{{ url_for('admin.orders') }}" class="ai-icon">
              <i class="fa-solid fa-receipt"></i>
              <span class="nav-text">Orders</span>
            </a>
          </li>
          <li class="{{ 'mm-active' if request.endpoint == 'admin.menu' }}">
            <a href="{{ url_for('admin.menu') }}" class="ai-icon">
              <i class="fa-solid fa-utensils"></i>
              <span class="nav-text">Menu</span>
            </a>
          </li>
          <li class="{{ 'mm-active' if request.endpoint == 'admin.users' }}">
            <a href="{{ url_for('admin.users') }}" class="ai-icon">
              <i class="fa-solid fa-users"></i>
              <span class="nav-text">Users</span>
            </a>
          </li>
        </ul>
      </div>
    </div>

    <div class="content-body">
      <div class="container-fluid">
        {% block content %}{% endblock %}
      </div>
    </div>

    <footer class="footer">
      <div class="copyright">
        <p class="text-muted">Lapar Smart: QR Menu Ordering System &mdash; FYP Demo</p>
      </div>
    </footer>
  </div>

  <script src="{{ url_for('static', filename='vendor/dashboard/vendor/global/global.min.js') }}"></script>
  <script src="{{ url_for('static', filename='vendor/dashboard/js/custom.min.js') }}"></script>
  <script src="{{ url_for('static', filename='vendor/dashboard/js/deznav-init.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
